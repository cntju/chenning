# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - serve.sh
  - CHANGE_ME_FIRST.md

# GitHub Pages-supported plugins only.
