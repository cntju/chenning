name: "CHEN Ning"
title: "MSCA Postdoctoral Fellow"
institution: "University of Exeter"
email: "n.chen@exeter.ac.uk"
photo: "/images/android-chrome-512x512.png"

# Main research positioning shown across the site
tagline: "Intelligent, Autonomous & Resilient Networked Systems"
description: "Academic homepage of Chen Ning — IoT, network resilience, edge intelligence, AI for networking, and topology optimization."

# Replace YOUR_GITHUB_USERNAME after creating the repository.
url: "https://chenning.github.io"
baseurl: ""

# Public profile links. Leave a value blank to hide it.
links:
  google_scholar: "https://scholar.google.com/citations?hl=en&user=QBz7NS0AAAAJ&view_op=list_works&sortby=pubdate"
  github: "https://github.com/cntju"
  orcid: ""
  linkedin: ""
  researchgate: ""
  cv: "/files/Chen_Ning_CV.pdf"

# Navigation. JOIN US is intentionally prominent.
nav_pages:
  - name: "Home"
    url: "/"
  - name: "Research"
    url: "/research/"
  - name: "Publications"
    url: "/publications/"
  - name: "People"
    url: "/people/"
  - name: "News"
    url: "/news/"
  - name: "Join Us"
    url: "/join/"
