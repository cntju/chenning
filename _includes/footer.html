<footer class="site-footer">
  <div class="footer-grid">
    <div>
      <strong>{{ site.name }}</strong>
      <p>{{ site.tagline }}</p>
    </div>
    <div>
      <p><a href="{{ '/join/' | relative_url }}">Prospective students & collaborators</a></p>
      <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    </div>
  </div>
  <div class="footer-bottom">
    <span>© <span id="current-year"></span> {{ site.name }}</span>
    <span>Built for GitHub Pages · Easy updates via Markdown/YAML</span>
  </div>
</footer>
