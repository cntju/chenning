<header class="site-header" id="top">
  <div class="nav-wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.name }} home">
      <span class="brand-mark">CN</span>
      <span class="brand-text">
        <strong>{{ site.name }}</strong>
        <small>Networked Systems</small>
      </span>
    </a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>

    <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
      {% for item in site.nav_pages %}
      <a href="{{ item.url | relative_url }}" class="{% if item.highlight %}nav-cta{% endif %}{% if page.url == item.url %} active{% endif %}">{{ item.name }}</a>
      {% endfor %}
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
    </nav>
  </div>
</header>
