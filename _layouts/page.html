---
layout: default
---
<section class="page-shell">
  <header class="page-header">
    <p class="eyebrow">{{ page.eyebrow | default: site.name }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-lead">{{ page.subtitle }}</p>{% endif %}
  </header>
  <article class="prose">
    {{ content }}
  </article>
</section>
